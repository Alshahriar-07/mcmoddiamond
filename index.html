<style>
:root{
  /* Drop your own Minecraft screenshot next to this file as minecraft-bg.jpg.
     If it is missing, the pixel-art world drawn below is shown instead. */
  --photo:url('minecraft-bg.jpg');
  --night:#0a111d; --ink:#e8eef2; --mute:#9aaab6; --dia:#4de8e0; --dia-hi:#bffaf6; --dia-lo:#1fb5b0; --gold:#f2c14e;
  --px:'Press Start 2P',monospace;
  --obsidian:#070b12;
  --deepslate:#101722;
  --deepslate-2:#151f2b;
  --stone:#2b3540;
  --stone-hi:#4a5662;
  --slot:#091019;
  --slot-hi:#172534;
  --line:#2d3b49;
  --emerald:#4fd177;
  --redstone:#e05a52;
  --white:#f3f7f9;
  --shadow:0 8px 0 rgba(0,0,0,.55);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{background:var(--night);color:var(--ink);font:17px/1.65 'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
body.nav-open{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--dia);outline-offset:4px}
code{font-family:ui-monospace,Consolas,monospace;font-size:.92em}
::selection{background:var(--dia);color:#04161a}

/* PRESERVED BACKGROUND STACK — visual implementation intentionally unchanged. */
#world{position:fixed;left:-20px;top:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;image-rendering:pixelated;z-index:-3;transition:transform .2s ease-out}
.photo{position:fixed;inset:0;z-index:-2;background:var(--photo) center/cover no-repeat}
.veil{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,10,15,.5),rgba(6,10,15,.82) 60%,rgba(6,10,15,.92))}

.wrap{width:min(1180px,calc(100% - 40px));margin-inline:auto}
.pixel-panel{
  position:relative;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.024) 0 1px,transparent 1px 4px),
    linear-gradient(145deg,rgba(21,31,43,.97),rgba(8,14,21,.97));
  border:3px solid #030507;
  box-shadow:
    0 0 0 2px #2a3744,
    inset 2px 2px 0 rgba(255,255,255,.09),
    inset -2px -2px 0 rgba(0,0,0,.6),
    var(--shadow);
}
.pixel-panel::before,.pixel-panel::after{
  content:"";position:absolute;width:5px;height:5px;background:var(--stone-hi);z-index:2;
  box-shadow:0 0 0 1px #000;
}
.pixel-panel::before{left:7px;top:7px}
.pixel-panel::after{right:7px;top:7px}

/* ---------- pixel controls ---------- */
.pixel-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:16px 20px;border:3px solid #030507;
  font:10px/1.45 var(--px);letter-spacing:.02em;text-align:center;text-transform:uppercase;
  color:#fff;background:#5d6772;cursor:pointer;
  box-shadow:inset 3px 3px 0 #8e98a2,inset -3px -3px 0 #343d46,0 5px 0 #000;
  transition:transform .14s steps(2,end),background .14s,box-shadow .14s;
}
.pixel-btn:hover{background:#6b7785;transform:translateY(-2px);box-shadow:inset 3px 3px 0 #a2acb5,inset -3px -3px 0 #343d46,0 7px 0 #000}
.pixel-btn:active{transform:translateY(4px);box-shadow:inset 3px 3px 0 #8e98a2,inset -3px -3px 0 #343d46,0 1px 0 #000}
.pixel-btn--diamond{background:var(--dia);color:#031417;box-shadow:inset 3px 3px 0 var(--dia-hi),inset -3px -3px 0 var(--dia-lo),0 5px 0 #000}
.pixel-btn--diamond:hover{background:#7af2eb;box-shadow:inset 3px 3px 0 #ddfffd,inset -3px -3px 0 var(--dia-lo),0 7px 0 #000}
.pixel-btn--emerald{background:#23894b;color:#f2fff6;box-shadow:inset 3px 3px 0 #50d982,inset -3px -3px 0 #0f5a2a,0 5px 0 #000}
.pixel-btn--emerald:hover{background:#2b9f58;box-shadow:inset 3px 3px 0 #6de99c,inset -3px -3px 0 #0f5a2a,0 7px 0 #000}
.pixel-btn--gold{background:var(--gold);color:#1c1302;box-shadow:inset 3px 3px 0 #ffe18a,inset -3px -3px 0 #9e7316,0 5px 0 #000}
.pixel-btn--gold:hover{background:#ffd66b;box-shadow:inset 3px 3px 0 #fff0b8,inset -3px -3px 0 #9e7316,0 7px 0 #000}
.pixel-btn img{width:18px;height:18px;image-rendering:pixelated;flex:none}
.pixel-btn--small{min-height:44px;padding:12px 14px;font-size:8px}
.btn-icon{width:19px;height:19px;display:inline-grid;place-items:center;flex:none}
.btn-icon svg{width:19px;height:19px;display:block;fill:currentColor}

.pixel-tag{
  display:inline-flex;align-items:center;gap:8px;padding:7px 10px;
  border:2px solid #000;background:#081019;color:var(--mute);
  font:7px/1.5 var(--px);letter-spacing:.03em;text-transform:uppercase;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.06);
}
.pixel-tag--live{color:var(--dia);border-color:#173a40;background:#06171a}
.pixel-tag--gold{color:var(--gold);border-color:#4a3b16;background:#171207}
.dot{width:8px;height:8px;background:var(--emerald);box-shadow:0 0 0 2px #06210f;flex:none}
.dot--cyan{background:var(--dia);box-shadow:0 0 0 2px #05282b}

/* ---------- navigation ---------- */
.site-header{
  position:sticky;top:0;z-index:100;
  background:rgba(7,11,18,.97);
  border-bottom:4px solid #020405;
  box-shadow:0 5px 0 rgba(0,0,0,.4);
}
.site-header::after{
  content:"";display:block;height:4px;
  background:repeating-linear-gradient(90deg,var(--dia) 0 18px,#132a31 18px 36px);
  opacity:.65;
}
.nav-shell{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:82px;position:relative}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand img{width:46px;height:46px;image-rendering:pixelated;border:2px solid #000;box-shadow:inset 0 0 0 2px #283541}
.brand-copy{display:flex;flex-direction:column;gap:3px}
.brand-name{font:11px/1.5 var(--px);letter-spacing:-.02em;color:var(--white);text-shadow:2px 2px 0 #000}
.brand-sub{font:7px/1.4 var(--px);letter-spacing:.06em;color:var(--dia)}
.nav-menu{display:flex;align-items:center;gap:2px}
.nav-link{
  position:relative;display:inline-flex;align-items:center;gap:7px;
  padding:16px 9px;font:7px/1.4 var(--px);text-transform:uppercase;color:#b3c1cb;
  transition:color .14s;
}
.nav-link:hover,.nav-link:focus-visible,.nav-link.is-active{color:var(--white)}
.nav-link.is-active::after{
  content:"";position:absolute;left:7px;right:7px;bottom:7px;height:4px;
  background:var(--dia);box-shadow:0 2px 0 #000;
}
.nav-link svg{width:15px;height:15px;fill:currentColor;flex:none}
.nav-link--icon{padding-inline:9px}
.nav-toggle{
  display:none;width:48px;height:44px;border:3px solid #000;background:#1b2834;cursor:pointer;
  box-shadow:inset 2px 2px 0 #405164,inset -2px -2px 0 #070b10,0 3px 0 #000;
  align-items:center;justify-content:center;flex-direction:column;gap:5px;
}
.nav-toggle span{display:block;width:22px;height:4px;background:var(--dia);box-shadow:0 0 0 1px #000;transition:transform .15s,opacity .15s}
.nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(9px) rotate(45deg)}
.nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
.nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-9px) rotate(-45deg)}

/* ---------- hero ---------- */
.hero{
  display:grid;grid-template-columns:minmax(0,1.06fr) minmax(380px,.94fr);
  gap:clamp(36px,5vw,72px);align-items:center;
  min-height:calc(100vh - 90px);padding:70px 0 84px;
}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.eyebrow__line{width:34px;height:4px;background:var(--dia);box-shadow:0 0 0 2px #000}
.hero h1{
  font:clamp(33px,5.7vw,67px)/1.25 var(--px);
  text-shadow:5px 5px 0 #000;letter-spacing:-.045em;margin-bottom:26px;
}
.hero h1 span{display:block}
.hero h1 .hero-title-accent{color:var(--dia);text-shadow:5px 5px 0 #000,9px 9px 0 rgba(0,0,0,.32);margin-top:8px}
.hero h1 .hero-title-accent small{font-size:.42em;color:var(--gold);vertical-align:middle;margin-left:8px;letter-spacing:0}
.hero-lead{max-width:620px;font-size:clamp(17px,1.5vw,20px);line-height:1.75;color:#d1dce4}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero-note{display:flex;align-items:center;gap:9px;margin-top:20px;color:#aebbc5;font-size:14px}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:32px;max-width:650px}
.meta-slot{
  min-height:70px;padding:12px 11px;border:2px solid #000;
  background:rgba(8,15,23,.88);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.06),inset -2px -2px 0 rgba(0,0,0,.5);
}
.meta-slot small{display:block;font:6px/1.5 var(--px);color:#8395a3;text-transform:uppercase;margin-bottom:7px}
.meta-slot strong{display:block;font:8px/1.5 var(--px);color:var(--ink);text-transform:uppercase}
.meta-slot strong.cyan{color:var(--dia)}
.meta-slot strong.gold{color:var(--gold)}

.hero-stage{position:relative;isolation:isolate;padding:18px 0 18px 16px}
.block-deco{
  position:absolute;z-index:-1;width:78px;height:78px;border:4px solid #000;
  background:linear-gradient(135deg,#315c60 0 24%,#1c3f43 24% 48%,#4de8e0 48% 52%,#163236 52% 100%);
  box-shadow:inset 5px 5px 0 rgba(255,255,255,.13),inset -5px -5px 0 rgba(0,0,0,.42),8px 8px 0 rgba(0,0,0,.35);
  image-rendering:pixelated;
}
.block-deco--one{right:-8px;top:-22px;transform:rotate(4deg)}
.block-deco--two{left:-22px;bottom:8px;width:54px;height:54px;background:linear-gradient(135deg,#6c5523,#a7802b 35%,#3b2e12 36% 100%);transform:rotate(-5deg)}
.hero-console{padding:12px;background:rgba(8,14,21,.94)}
.console-top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:2px solid #000;background:#0b141e;padding:10px 12px;margin-bottom:10px;
  font:6px/1.5 var(--px);color:#aab8c3;letter-spacing:.03em;
}
.console-top span{display:flex;align-items:center;gap:7px}
.console-dots{display:flex;gap:4px}
.console-dots i{display:block;width:7px;height:7px;background:#324454;box-shadow:0 0 0 1px #000}
.console-dots i:nth-child(1){background:var(--redstone)}
.console-dots i:nth-child(2){background:var(--gold)}
.console-dots i:nth-child(3){background:var(--emerald)}
.ore-zone{display:grid;grid-template-columns:minmax(0,1fr) minmax(126px,.62fr);gap:10px;align-items:stretch}
.ore-stage{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  min-height:296px;padding:20px;border:2px solid #000;background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 8px,transparent 8px 16px),
    #09121a;
  box-shadow:inset 4px 4px 0 rgba(255,255,255,.04),inset -4px -4px 0 rgba(0,0,0,.48);
}
.ore-wrap{position:relative}
#oreBtn{
  display:block;width:min(238px,46vw);aspect-ratio:1;padding:0;cursor:pointer;
  border:6px solid #030507;background:#111;box-shadow:
    0 0 0 2px #4b5a65,inset 0 0 0 2px #000,
    10px 10px 0 rgba(0,0,0,.38);
  transition:filter .15s,transform .15s;
}
#oreBtn:hover{filter:brightness(1.16);transform:translateY(-2px)}
#oreBtn:active{transform:translateY(2px)}
#oreBtn.shake{animation:shake .18s}
@keyframes shake{25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
#ore{width:100%;height:100%;image-rendering:pixelated;display:block}
.chip{position:absolute;left:50%;top:50%;width:12px;height:12px;border:2px solid #000;animation:fly .8s cubic-bezier(.3,.6,.5,1) forwards;pointer-events:none}
@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.ore-label{font:6px/1.5 var(--px);color:#8ca0ae;text-transform:uppercase;letter-spacing:.08em;text-align:center}
.ore-label strong{color:var(--dia);display:block;margin-top:5px}
.console-side{display:flex;flex-direction:column;gap:10px}
.mini-panel{
  flex:1;padding:13px 11px;border:2px solid #000;background:#0b151e;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.05),inset -2px -2px 0 rgba(0,0,0,.55);
}
.mini-panel small{display:block;font:6px/1.5 var(--px);color:#7d909e;text-transform:uppercase;margin-bottom:10px}
.score-value{font:20px/1.2 var(--px);color:var(--white);text-shadow:3px 3px 0 #000}
.score-value span{color:var(--dia)}
.score-sub{font-size:11px;line-height:1.5;color:#8fa1ae;margin-top:8px}
.match-line{display:flex;align-items:center;justify-content:space-between;gap:6px;font:6px/1.5 var(--px);color:#a8b7c1;margin-top:8px}
.match-line b{color:var(--gold);font-weight:400}
.hotbar{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px;padding:5px;border:2px solid #000;background:#080e15}
.hotbar-slot{
  aspect-ratio:1;border:2px solid #000;background:#141f2a;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.06),inset -2px -2px 0 rgba(0,0,0,.5);
  display:grid;place-items:center;min-width:0;
}
.hotbar-slot img{width:74%;height:74%;object-fit:contain;image-rendering:pixelated}
.hotbar-slot.is-selected{outline:3px solid var(--dia);outline-offset:-5px;background:#1b3039}
.hero-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;color:#8296a4;font-size:11px}
.hero-footer code{color:var(--dia);font-size:11px}
.hero-footer span{display:flex;align-items:center;gap:6px}

/*__MORE_CSS__*/
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<div class="photo" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<!--__BODY__-->

<div id="toast" role="status" aria-live="polite"></div>
<!--__SCRIPT__-->
</body>
</html>
